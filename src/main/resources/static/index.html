<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Projetos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Controle de Projetos</h1>
    </header>

    <main>
        <section class="card">
            <h2>Novo projeto</h2>
            <form id="form-projeto" novalidate>
                <div class="campo campo-largo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" name="descricao" maxlength="200" placeholder="Ex.: Portal do Aluno">
                </div>
                <div class="campo">
                    <label for="dataInicio">Data de início</label>
                    <input type="date" id="dataInicio" name="dataInicio">
                </div>
                <div class="campo">
                    <label for="dataFim">Data de fim</label>
                    <input type="date" id="dataFim" name="dataFim">
                </div>
                <div class="acoes">
                    <button type="submit" id="btn-salvar">Salvar projeto</button>
                </div>
            </form>
            <div id="mensagem" class="mensagem" role="alert" hidden></div>
        </section>

        <section class="card">
            <div class="titulo-lista">
                <h2>Projetos cadastrados</h2>
                <button type="button" id="btn-atualizar" class="secundario">Atualizar</button>
            </div>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Descrição</th>
                            <th>Início</th>
                            <th>Fim</th>
                            <th>Funcionários</th>
                        </tr>
                    </thead>
                    <tbody id="lista-projetos">
                        <tr><td colspan="5" class="vazio">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
